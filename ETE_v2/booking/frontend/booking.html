<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Eye Test</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0f172a;
  --ink-secondary: #475569;
  --ink-muted: #94a3b8;
  --surface: #f8fafc;
  --surface-card: #ffffff;
  --surface-hover: #f1f5f9;
  --border: #e2e8f0;
  --border-focus: #3b82f6;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-glow: rgba(37,99,235,0.12);
  --success: #059669;
  --success-bg: #ecfdf5;
  --warning: #d97706;
  --danger: #dc2626;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.06);
  --shadow-md: 0 4px 12px rgba(15,23,42,0.08);
  --shadow-lg: 0 8px 30px rgba(15,23,42,0.12);
  --font-body: 'DM Sans', system-ui, -apple-system, sans-serif;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 15px; }
body {
  font-family: var(--font-body);
  background: var(--surface);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.header {
  background: var(--ink);
  color: white;
  padding: 1.5rem 1.5rem 1.2rem;
  text-align: center;
}
.header h1 { font-size: 1.3rem; font-weight: 600; letter-spacing: -0.02em; }
.header .location-badge {
  display: inline-block;
  margin-top: 0.4rem;
  background: rgba(255,255,255,0.15);
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 500;
}

/* Mobile-first container */
.container { max-width: 1100px; margin: 0 auto; padding: 1rem 1rem 3rem; }

.loading { text-align: center; padding: 3rem 1rem; color: var(--ink-muted); }
.loading .spinner {
  width: 32px; height: 32px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 0 auto 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error-msg {
  background: #fef2f2; border: 1px solid #fecaca; color: var(--danger);
  padding: 0.8rem 1rem; border-radius: var(--radius-md); margin-bottom: 1rem;
  font-size: 0.9rem;
}

/* ── Desktop: side-by-side layout ── */
.booking-layout { display: flex; flex-direction: column; gap: 1rem; }

@media (min-width: 768px) {
  .booking-layout {
    flex-direction: row;
    align-items: flex-start;
  }
  .days-panel {
    width: 280px;
    flex-shrink: 0;
    position: sticky;
    top: 1rem;
  }
  .slots-panel {
    flex: 1;
    min-width: 0;
  }
}

/* Day list */
.day-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.7rem 0.9rem;
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 0.35rem;
  cursor: pointer; user-select: none;
  transition: all 0.15s;
}
.day-item:hover { background: var(--surface-hover); }
.day-item.active { border-color: var(--accent); background: var(--accent-glow); }
.day-item.no-slots { opacity: 0.45; cursor: default; }
.day-item .day-label { font-weight: 600; font-size: 0.9rem; }
.day-item .day-sub { font-size: 0.78rem; color: var(--ink-secondary); }
.day-avail {
  font-size: 0.78rem; font-weight: 500;
  padding: 2px 9px; border-radius: 20px; white-space: nowrap;
}
.day-avail.has-slots { background: var(--success-bg); color: var(--success); }
.day-avail.full { background: #fef2f2; color: var(--danger); }
.day-avail.closed { background: var(--surface-hover); color: var(--ink-muted); }

/* Slots panel */
.slots-panel-card {
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 1.2rem;
  box-shadow: var(--shadow-sm);
}
.slots-panel-card h2 {
  font-size: 1rem; font-weight: 600; margin-bottom: 0.8rem;
  display: flex; align-items: center; gap: 0.5rem;
}
.slots-panel-card h2 .date-chip {
  font-size: 0.8rem; font-weight: 500;
  background: var(--accent-glow); color: var(--accent);
  padding: 2px 10px; border-radius: 14px;
}

.slots-grid {
  display: flex; flex-wrap: wrap; gap: 0.4rem;
}

.slot-pill {
  padding: 7px 16px; border-radius: var(--radius-sm);
  font-size: 0.84rem; font-weight: 500; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface-card);
  transition: all 0.15s;
}
.slot-pill.available:hover {
  background: var(--accent-glow); border-color: var(--accent); color: var(--accent);
}
.slot-pill.selected {
  background: var(--accent); color: white; border-color: var(--accent);
}
.slot-pill.full {
  background: var(--surface-hover); color: var(--ink-muted);
  cursor: not-allowed; text-decoration: line-through;
}

/* Booking form — inline below slots on desktop */
.booking-form {
  display: none;
  border-top: 1px solid var(--border);
  padding-top: 1rem;
  margin-top: 1rem;
}
.booking-form.visible { display: block; }
.booking-form h3 {
  font-size: 0.95rem; font-weight: 600; margin-bottom: 0.8rem;
  color: var(--accent);
}

.form-grid {
  display: grid; grid-template-columns: 1fr; gap: 0.6rem;
}
@media (min-width: 768px) {
  .form-grid { grid-template-columns: 1fr 1fr 1fr; }
  .form-grid .form-full { grid-column: 1 / -1; }
}

.form-row { }
.form-row label {
  display: block; font-size: 0.8rem; font-weight: 500;
  color: var(--ink-secondary); margin-bottom: 3px;
}
.form-row input {
  width: 100%; padding: 8px 12px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font: 400 0.9rem var(--font-body); color: var(--ink);
  transition: border-color 0.15s;
}
.form-row input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

.btn-book {
  padding: 10px 32px;
  background: var(--accent); color: white; border: none;
  border-radius: var(--radius-sm);
  font: 600 0.9rem var(--font-body);
  cursor: pointer; transition: background 0.15s;
}
.btn-book:hover { background: var(--accent-hover); }
.btn-book:disabled { opacity: 0.5; cursor: not-allowed; }

/* Success screen */
.success-screen {
  display: none; text-align: center; padding: 2rem 1rem;
}
.success-screen.visible { display: block; }
.success-icon {
  width: 64px; height: 64px; background: var(--success-bg);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1rem;
}
.success-icon svg { color: var(--success); }
.success-screen h2 { font-size: 1.2rem; margin-bottom: 0.5rem; }
.success-screen .detail {
  font-size: 0.9rem; color: var(--ink-secondary); margin-bottom: 0.3rem;
}
.success-screen .manage-link {
  display: inline-block; margin-top: 1rem; padding: 8px 20px;
  background: var(--surface-card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--accent);
  font-weight: 500; font-size: 0.85rem; text-decoration: none;
}
.success-screen .manage-link:hover { background: var(--accent-glow); }

.empty-slots {
  color: var(--ink-muted); font-size: 0.9rem; padding: 2rem; text-align: center;
}
</style>
</head>
<body>

<div class="header">
  <h1>Book Your Eye Test</h1>
  <div class="location-badge" id="locationBadge">Loading...</div>
</div>

<div class="container">
  <div class="loading" id="loadingState">
    <div class="spinner"></div>
    <div>Loading available slots...</div>
  </div>

  <div id="errorState" style="display:none"></div>

  <div class="booking-layout" id="bookingLayout" style="display:none">
    <!-- Left: day list -->
    <div class="days-panel" id="daysPanel"></div>

    <!-- Right: slots + form -->
    <div class="slots-panel">
      <div class="slots-panel-card" id="slotsCard">
        <h2>Select a time <span class="date-chip" id="slotDateChip"></span></h2>
        <div class="slots-grid" id="slotsGrid">
          <div class="empty-slots">Select a day to view available slots</div>
        </div>
        <div class="booking-form" id="bookingForm">
          <h3 id="formTitle">Book slot</h3>
          <div class="form-grid">
            <div class="form-row">
              <label for="patientName">Full Name</label>
              <input type="text" id="patientName" placeholder="Your full name" required>
            </div>
            <div class="form-row">
              <label for="patientEmail">Email</label>
              <input type="email" id="patientEmail" placeholder="your@email.com" required>
              <div id="emailHint" style="font-size:0.7rem;color:var(--ink-muted);margin-top:3px"></div>
            </div>
            <div class="form-row">
              <label for="patientPhone">Phone Number</label>
              <input type="tel" id="patientPhone" placeholder="Mobile number" required>
            </div>
            <div class="form-row form-full" style="text-align:right">
              <button class="btn-book" id="btnBook" onclick="submitBooking()">Confirm Booking</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="success-screen" id="successScreen">
    <div class="success-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h2>Booking Confirmed!</h2>
    <div class="detail" id="successLocation"></div>
    <div class="detail" id="successDateTime"></div>
    <div class="detail" id="successName"></div>
    <div style="font-size:0.82rem;color:var(--ink-muted);margin-top:0.5rem">A calendar invite has been added to the schedule.</div>
    <a class="manage-link" id="manageLink" href="#">Manage Booking (Cancel / Reschedule)</a>
  </div>
</div>

<script>
const slug = window.location.pathname.split('/')[2];
let selectedDate = null;
let selectedSlot = null;
let locationData = null;
let activeDayEl = null;
let allowedDomains = ['lenskart.com', 'gmail.com']; // Will be updated from server
// Note: pre-emptive "you're already booked" grey-out was removed for privacy.
// Duplicate-same-day bookings are now caught atomically by the server on submit.

async function init() {
  // Load allowed domains in parallel (non-blocking — fall back to defaults on failure)
  fetch('/api/booking/allowed-domains')
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (data && data.domains && data.domains.length) {
        allowedDomains = data.domains;
        // Show hint under email field
        const hint = document.getElementById('emailHint');
        if (hint) {
          hint.textContent = 'Allowed: ' + allowedDomains.map(d => '@' + d).join(', ');
        }
      }
    })
    .catch(() => {});

  try {
    const resp = await fetch(`/api/booking/${slug}/availability`);
    if (!resp.ok) throw new Error((await resp.json()).error || 'Location not found');
    const data = await resp.json();
    locationData = data;
    document.getElementById('locationBadge').textContent = data.location;
    document.title = `Book Eye Test — ${data.location}`;
    renderDays(data.days);

    // Auto-expand first available day
    const firstAvail = data.days.find(d => d.is_working_day && d.available_slots > 0);
    if (firstAvail) {
      selectDay(firstAvail.date);
    }
  } catch (e) {
    showError(e.message);
  }
}

function renderDays(days) {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('bookingLayout').style.display = 'flex';
  const panel = document.getElementById('daysPanel');
  panel.innerHTML = '';

  days.forEach(day => {
    const d = new Date(day.date + 'T00:00:00');
    const dateStr = d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
    const now = new Date();
    const todayStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
    const isToday = day.date === todayStr;
    const disabled = !day.is_working_day || day.available_slots === 0;

    let availText, availClass;
    if (!day.is_working_day) {
      availText = 'Closed'; availClass = 'closed';
    } else if (day.available_slots === 0) {
      availText = 'Full'; availClass = 'full';
    } else {
      availText = `${day.available_slots} slot${day.available_slots > 1 ? 's' : ''}`;
      availClass = 'has-slots';
    }

    const item = document.createElement('div');
    item.className = 'day-item' + (disabled ? ' no-slots' : '');
    item.dataset.date = day.date;
    const labelEl = document.createElement('div');
    labelEl.className = 'day-label';
    labelEl.textContent = dateStr + (isToday ? ' (Today)' : '');
    const wrapper = document.createElement('div');
    wrapper.appendChild(labelEl);
    item.appendChild(wrapper);
    const availEl = document.createElement('span');
    availEl.className = 'day-avail ' + availClass;
    availEl.textContent = availText;
    item.appendChild(availEl);

    if (!disabled) {
      item.onclick = () => selectDay(day.date);
    }
    panel.appendChild(item);
  });
}

async function selectDay(date) {
  // Highlight active day
  document.querySelectorAll('.day-item.active').forEach(el => el.classList.remove('active'));
  const dayEl = document.querySelector(`.day-item[data-date="${date}"]`);
  if (dayEl) dayEl.classList.add('active');

  selectedDate = date;
  selectedSlot = null;
  hideForm();

  const d = new Date(date + 'T00:00:00');
  const dateStr = d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
  document.getElementById('slotDateChip').textContent = dateStr;

  const grid = document.getElementById('slotsGrid');
  grid.innerHTML = '<div class="empty-slots">Loading slots...</div>';

  try {
    const resp = await fetch(`/api/booking/${slug}/slots?date=${date}`);
    const data = await resp.json();
    renderSlots(grid, date, data.slots);
  } catch (e) {
    grid.innerHTML = '<div class="empty-slots" style="color:var(--danger)">Failed to load slots</div>';
  }
}

function renderSlots(grid, date, slots) {
  grid.innerHTML = '';
  slots.forEach(slot => {
    const pill = document.createElement('button');
    pill.className = 'slot-pill ' + (slot.is_available ? 'available' : 'full');
    pill.textContent = formatTime(slot.start);
    if (slot.is_available) {
      pill.onclick = () => selectSlot(date, slot.start, slot.end, pill);
    }
    grid.appendChild(pill);
  });
}

function selectSlot(date, start, end, pillEl) {
  document.querySelectorAll('.slot-pill.selected').forEach(p => p.classList.remove('selected'));
  pillEl.classList.add('selected');

  selectedDate = date;
  selectedSlot = start;

  const d = new Date(date + 'T00:00:00');
  const dateStr = d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
  document.getElementById('formTitle').textContent = `Book ${formatTime(start)} on ${dateStr}`;
  showForm();
}

function showForm() {
  document.getElementById('bookingForm').classList.add('visible');
  document.getElementById('patientName').focus();
}

function hideForm() {
  document.getElementById('bookingForm').classList.remove('visible');
  selectedSlot = null;
}

async function submitBooking() {
  const name = document.getElementById('patientName').value.trim();
  const email = document.getElementById('patientEmail').value.trim().toLowerCase();
  const phone = document.getElementById('patientPhone').value.trim();

  if (!name || !email || !phone) { alert('Please fill all fields'); return; }
  if (!selectedDate || !selectedSlot) { alert('Please select a slot'); return; }

  // Phone: exactly 10 digits, no other characters
  const phoneClean = phone.replace(/\s+/g, '');
  if (!/^\d{10}$/.test(phoneClean)) {
    alert('Phone number must be exactly 10 digits');
    return;
  }

  // Email: valid format AND domain in the allowed list
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    alert('Please enter a valid email address');
    return;
  }
  const domain = email.split('@')[1];
  if (!allowedDomains.includes(domain)) {
    alert('Email must be from one of: ' + allowedDomains.map(d => '@' + d).join(', '));
    return;
  }

  const btn = document.getElementById('btnBook');
  btn.disabled = true;
  btn.textContent = 'Booking...';

  try {
    const resp = await fetch(`/api/booking/${slug}/book`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        patient_name: name,
        patient_email: email,
        patient_phone: phoneClean,
        date: selectedDate,
        slot_start: selectedSlot,
      }),
    });
    const data = await resp.json();

    if (!resp.ok || !data.ok) {
      throw new Error(data.error || 'Booking failed');
    }

    showSuccess(name, selectedDate, selectedSlot, data.manage_url);
  } catch (e) {
    alert(e.message);
    btn.disabled = false;
    btn.textContent = 'Confirm Booking';
    // If the slot got filled while the user was deciding, refresh the day's slot list
    if (/full/i.test(e.message) && selectedDate) {
      // Re-fetch slots for the selected date
      try {
        const r = await fetch(`/api/booking/${slug}/slots?date=${selectedDate}`);
        const d = await r.json();
        renderSlots(document.getElementById('slotsGrid'), selectedDate, d.slots);
      } catch (_) {}
    }
  }
}

function showSuccess(name, date, time, manageUrl) {
  document.getElementById('bookingLayout').style.display = 'none';

  const d = new Date(date + 'T00:00:00');
  const dateStr = d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  document.getElementById('successLocation').textContent = locationData.location;
  document.getElementById('successDateTime').textContent = `${dateStr} at ${formatTime(time)}`;
  document.getElementById('successName').textContent = name;
  document.getElementById('manageLink').href = manageUrl;
  document.getElementById('successScreen').classList.add('visible');
}

function formatTime(t) {
  const [h, m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2, '0')} ${ampm}`;
}

function showError(msg) {
  document.getElementById('loadingState').style.display = 'none';
  const el = document.getElementById('errorState');
  el.style.display = 'block';
  el.innerHTML = `<div class="error-msg">${msg}</div>`;
}

init();
</script>
</body>
</html>
