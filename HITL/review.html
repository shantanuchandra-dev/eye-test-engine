<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HITL Review — Eye Test Voice Annotations</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; }

        /* ── Auth Screen ───────────────────────────── */
        .auth-overlay {
            position: fixed; inset: 0; background: linear-gradient(135deg, #0d47a1, #1565c0, #42a5f5);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .auth-overlay.hidden { display: none; }
        .auth-card {
            background: #fff; border-radius: 16px; padding: 40px; width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-card h1 { font-size: 1.5rem; color: #0d47a1; margin-bottom: 8px; }
        .auth-card p { color: #888; font-size: 0.85rem; margin-bottom: 24px; }
        .auth-card input {
            width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 0.9rem; margin-bottom: 12px; outline: none; transition: border 0.2s;
        }
        .auth-card input:focus { border-color: #1565c0; }
        .auth-card button {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            background: #1565c0; color: #fff; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: background 0.2s; margin-bottom: 8px;
        }
        .auth-card button:hover { background: #0d47a1; }
        .auth-card .toggle { text-align: center; font-size: 0.8rem; color: #888; cursor: pointer; }
        .auth-card .toggle:hover { color: #1565c0; }
        .auth-card .error { color: #c62828; font-size: 0.8rem; margin-bottom: 8px; display: none; }

        /* ── Top Bar ───────────────────────────────── */
        .topbar {
            background: #263238; color: #fff; padding: 10px 20px;
            display: flex; align-items: center; gap: 16px;
        }
        .topbar h1 { font-size: 1.1rem; font-weight: 600; }
        .topbar .spacer { flex: 1; }
        .topbar .user-info { font-size: 0.8rem; color: #b0bec5; }
        .topbar button {
            background: rgba(255,255,255,0.15); border: none; color: #fff;
            padding: 6px 14px; border-radius: 6px; font-size: 0.8rem; cursor: pointer;
        }
        .topbar button:hover { background: rgba(255,255,255,0.25); }

        /* ── Stats Bar ─────────────────────────────── */
        .stats-bar {
            display: flex; gap: 12px; padding: 16px 20px; background: #fff;
            border-bottom: 1px solid #e0e0e0; flex-wrap: wrap;
        }
        .stat-card {
            background: #f5f7fa; border-radius: 10px; padding: 12px 18px;
            min-width: 110px; text-align: center;
        }
        .stat-card .stat-value { font-size: 1.5rem; font-weight: 700; color: #0d47a1; }
        .stat-card .stat-label { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 0.03em; }
        .stat-card.accent .stat-value { color: #c62828; }
        .stat-card.green .stat-value { color: #2e7d32; }

        /* ── Filters ───────────────────────────────── */
        .filters {
            display: flex; gap: 10px; padding: 12px 20px; background: #fff;
            border-bottom: 1px solid #e0e0e0; flex-wrap: wrap; align-items: center;
        }
        .filters select, .filters input {
            padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px;
            font-size: 0.8rem; outline: none;
        }
        .filters select:focus, .filters input:focus { border-color: #1565c0; }
        .filters label { font-size: 0.75rem; color: #888; font-weight: 600; }
        .filters button {
            padding: 6px 16px; border: none; border-radius: 6px;
            background: #1565c0; color: #fff; font-size: 0.8rem; cursor: pointer;
        }
        .filters button:hover { background: #0d47a1; }
        .filters button.secondary { background: #78909c; }

        /* ── Table ─────────────────────────────────── */
        .table-container { padding: 0 20px 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 12px; }
        thead th {
            background: #263238; color: #fff; padding: 10px 8px; text-align: left;
            font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em;
            position: sticky; top: 0; z-index: 10;
        }
        tbody tr { border-bottom: 1px solid #eee; transition: background 0.15s; }
        tbody tr:hover { background: #f0f4ff; }
        tbody td { padding: 8px; vertical-align: middle; }
        tbody tr.needs-review { background: #fff8e1; }
        tbody tr.is-garbage { background: #fbe9e7; opacity: 0.6; }
        tbody tr.reviewed { background: #e8f5e9; }

        /* Audio player */
        .audio-play-btn {
            width: 32px; height: 32px; border-radius: 50%; border: none;
            background: #1565c0; color: #fff; cursor: pointer; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center;
        }
        .audio-play-btn:hover { background: #0d47a1; }
        .audio-play-btn.playing { background: #c62828; }

        /* Intent selector */
        .intent-select {
            padding: 4px 6px; border: 1px solid #ddd; border-radius: 4px;
            font-size: 0.75rem; min-width: 100px;
        }
        .intent-select.corrected { border-color: #ff9800; background: #fff3e0; }

        /* Status badges */
        .badge {
            display: inline-block; padding: 2px 8px; border-radius: 10px;
            font-size: 0.65rem; font-weight: 600; text-transform: uppercase;
        }
        .badge.match { background: #e8f5e9; color: #2e7d32; }
        .badge.no-match { background: #ffebee; color: #c62828; }
        .badge.reviewed { background: #e3f2fd; color: #1565c0; }
        .badge.garbage { background: #efebe9; color: #795548; }

        .confidence-bar {
            width: 50px; height: 6px; background: #eee; border-radius: 3px; display: inline-block;
        }
        .confidence-bar .fill {
            height: 100%; border-radius: 3px; transition: width 0.3s;
        }

        /* Bulk actions */
        .bulk-bar {
            display: none; padding: 10px 20px; background: #e3f2fd;
            border-bottom: 1px solid #bbdefb; align-items: center; gap: 12px;
        }
        .bulk-bar.active { display: flex; }
        .bulk-bar span { font-size: 0.8rem; color: #1565c0; font-weight: 600; }

        /* Pagination */
        .pagination {
            display: flex; justify-content: center; gap: 8px; padding: 16px;
        }
        .pagination button {
            padding: 6px 14px; border: 1px solid #ddd; border-radius: 6px;
            background: #fff; font-size: 0.8rem; cursor: pointer;
        }
        .pagination button:hover { background: #f0f4ff; }
        .pagination button.active { background: #1565c0; color: #fff; border-color: #1565c0; }
        .pagination button:disabled { opacity: 0.4; cursor: default; }

        .empty-state { text-align: center; padding: 60px 20px; color: #aaa; }
        .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }

        /* Checkbox */
        .row-checkbox { width: 16px; height: 16px; cursor: pointer; }
    </style>
</head>
<body>

<!-- Auth Overlay -->
<div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
        <h1 id="authTitle">Sign In</h1>
        <p id="authSubtitle">HITL Review — Eye Test Voice Annotations</p>
        <div id="authError" class="error"></div>
        <input id="authName" type="text" placeholder="Full Name" style="display:none;">
        <input id="authEmail" type="email" placeholder="Email">
        <input id="authPassword" type="password" placeholder="Password">
        <button id="authSubmit" onclick="handleAuth()">Sign In</button>
        <div class="toggle" onclick="toggleAuthMode()">
            <span id="authToggleText">Don't have an account? Register</span>
        </div>
    </div>
</div>

<!-- Main App -->
<div id="mainApp" style="display:none;">

    <!-- Top Bar -->
    <div class="topbar">
        <h1>HITL Voice Review</h1>
        <span class="spacer"></span>
        <span class="user-info" id="userInfo"></span>
        <button onclick="exportDataset('whisper')">Export Whisper</button>
        <button onclick="exportDataset('intent')">Export Intent</button>
        <button onclick="logout()">Logout</button>
    </div>

    <!-- Stats -->
    <div class="stats-bar" id="statsBar"></div>

    <!-- Filters -->
    <div class="filters">
        <label>Date</label>
        <input type="date" id="filterDate">
        <label>Status</label>
        <select id="filterStatus">
            <option value="">All</option>
            <option value="needs_review">Needs Review</option>
            <option value="reviewed">Reviewed</option>
            <option value="not_understood">Not Understood</option>
        </select>
        <label>Session</label>
        <input type="text" id="filterSession" placeholder="Session ID" style="width:140px;">
        <button onclick="loadUtterances()">Filter</button>
        <button class="secondary" onclick="clearFilters()">Clear</button>
    </div>

    <!-- Bulk Actions -->
    <div class="bulk-bar" id="bulkBar">
        <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
        <span id="bulkCount">0 selected</span>
        <button onclick="bulkApprove()">Approve Selected</button>
    </div>

    <!-- Table -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width:30px;"><input type="checkbox" id="headerCheckbox" onchange="toggleSelectAll()"></th>
                    <th>Play</th>
                    <th>Time</th>
                    <th>Transcript</th>
                    <th>Matched</th>
                    <th>Conf.</th>
                    <th>Correct Intent</th>
                    <th>State</th>
                    <th>Status</th>
                    <th>Reviewer</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="utteranceTable"></tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display:none;">
            <div class="icon">🎤</div>
            <div>No utterances found. Run a voice test to generate data.</div>
        </div>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>
</div>

<script>
const API = window.location.origin + '/api/review';
let authToken = localStorage.getItem('review_token');
let authUser = JSON.parse(localStorage.getItem('review_user') || 'null');
let isRegisterMode = false;
let currentPage = 1;
let currentData = [];
let selectedIds = new Set();
let currentAudio = null;

// Intent options per response type
const INTENT_OPTIONS = {
    READABILITY: ['READABLE', 'NOT_READABLE', 'BLURRY'],
    NEAR_READABILITY: ['READABLE', 'NOT_READABLE', 'BLURRY'],
    COMPARE_1_2: ['BETTER_1', 'BETTER_2', 'SAME', 'CANT_TELL'],
    COLOR_CHOICE: ['RED_CLEARER', 'GREEN_CLEARER', 'EQUAL', 'CANT_TELL'],
    TOP_BOTTOM: ['TOP_CLEARER', 'BOTTOM_CLEARER', 'SAME', 'CANT_TELL'],
    NEAR_BINOC: ['TARGET_OK', 'NOT_CLEAR'],
};

// ── Auth ──────────────────────────────────────────
function checkAuth() {
    if (authToken && authUser) {
        document.getElementById('authOverlay').classList.add('hidden');
        document.getElementById('mainApp').style.display = '';
        document.getElementById('userInfo').textContent = authUser.name + ' (' + authUser.email + ')';
        loadStats();
        loadUtterances();
    }
}

function toggleAuthMode() {
    isRegisterMode = !isRegisterMode;
    document.getElementById('authTitle').textContent = isRegisterMode ? 'Register' : 'Sign In';
    document.getElementById('authName').style.display = isRegisterMode ? '' : 'none';
    document.getElementById('authSubmit').textContent = isRegisterMode ? 'Register' : 'Sign In';
    document.getElementById('authToggleText').textContent = isRegisterMode
        ? 'Already have an account? Sign In'
        : "Don't have an account? Register";
    document.getElementById('authError').style.display = 'none';
}

async function handleAuth() {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const name = document.getElementById('authName').value.trim();
    const errorEl = document.getElementById('authError');

    const endpoint = isRegisterMode ? '/auth/register' : '/auth/login';
    const body = isRegisterMode ? { email, password, name } : { email, password };

    try {
        const resp = await fetch(API + endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });
        const data = await resp.json();
        if (!resp.ok) {
            errorEl.textContent = data.error || 'Error';
            errorEl.style.display = '';
            return;
        }

        if (isRegisterMode) {
            // Auto-login after register
            isRegisterMode = false;
            toggleAuthMode();
            errorEl.textContent = 'Registered! Please sign in.';
            errorEl.style.display = '';
            errorEl.style.color = '#2e7d32';
            return;
        }

        // Login success
        authToken = data.token;
        authUser = { email: data.email, name: data.name };
        localStorage.setItem('review_token', authToken);
        localStorage.setItem('review_user', JSON.stringify(authUser));
        checkAuth();
    } catch (e) {
        errorEl.textContent = 'Connection error';
        errorEl.style.display = '';
    }
}

function logout() {
    authToken = null;
    authUser = null;
    localStorage.removeItem('review_token');
    localStorage.removeItem('review_user');
    location.reload();
}

function authHeaders() {
    return { 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' };
}

// ── Stats ─────────────────────────────────────────
async function loadStats() {
    try {
        const resp = await fetch(API + '/stats', { headers: authHeaders() });
        if (resp.status === 401) { logout(); return; }
        const s = await resp.json();
        document.getElementById('statsBar').innerHTML = `
            <div class="stat-card"><div class="stat-value">${s.total_utterances}</div><div class="stat-label">Total</div></div>
            <div class="stat-card accent"><div class="stat-value">${s.needs_review}</div><div class="stat-label">Needs Review</div></div>
            <div class="stat-card green"><div class="stat-value">${s.reviewed}</div><div class="stat-label">Reviewed</div></div>
            <div class="stat-card"><div class="stat-value">${s.understood}</div><div class="stat-label">Understood</div></div>
            <div class="stat-card accent"><div class="stat-value">${s.not_understood}</div><div class="stat-label">Not Understood</div></div>
            <div class="stat-card"><div class="stat-value">${s.accuracy}%</div><div class="stat-label">Accuracy</div></div>
            <div class="stat-card"><div class="stat-value">${s.garbage}</div><div class="stat-label">Garbage</div></div>
        `;
    } catch (e) { console.error('Stats error:', e); }
}

// ── Utterances ────────────────────────────────────
async function loadUtterances() {
    const date = document.getElementById('filterDate').value;
    const status = document.getElementById('filterStatus').value;
    const session = document.getElementById('filterSession').value.trim();

    let params = new URLSearchParams({ page: currentPage, per_page: 30 });
    if (date) params.set('date', date);
    if (session) params.set('session', session);
    if (status === 'needs_review') params.set('needs_review', 'true');
    else if (status === 'reviewed') params.set('reviewed', 'true');
    else if (status === 'not_understood') params.set('needs_review', 'true');

    try {
        const resp = await fetch(API + '/utterances?' + params, { headers: authHeaders() });
        if (resp.status === 401) { logout(); return; }
        const data = await resp.json();
        currentData = data.utterances;
        renderTable(data);
        renderPagination(data);
        selectedIds.clear();
        updateBulkBar();
    } catch (e) { console.error('Load error:', e); }
}

function renderTable(data) {
    const tbody = document.getElementById('utteranceTable');
    const empty = document.getElementById('emptyState');

    if (data.utterances.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = '';
        return;
    }
    empty.style.display = 'none';

    tbody.innerHTML = data.utterances.map((u, i) => {
        const rowClass = u.is_garbage ? 'is-garbage' : (u.reviewed ? 'reviewed' : (u.needs_review ? 'needs-review' : ''));
        const time = u.timestamp ? new Date(u.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '';
        const dateStr = u._date || '';
        const confColor = u.confidence >= 80 ? '#4caf50' : (u.confidence >= 50 ? '#ff9800' : '#c62828');
        const confWidth = Math.min(100, u.confidence);

        const options = INTENT_OPTIONS[u.response_type] || [];
        const currentCorrect = u.correct_option || u.matched_option || '';
        const selectClass = u.correct_option ? 'corrected' : '';

        let statusBadge = '';
        if (u.is_garbage) statusBadge = '<span class="badge garbage">Garbage</span>';
        else if (u.reviewed) statusBadge = '<span class="badge reviewed">Reviewed</span>';
        else if (!u.was_understood) statusBadge = '<span class="badge no-match">No Match</span>';
        else statusBadge = '<span class="badge match">Matched</span>';

        const audioPath = u._date + '/' + u.session_id + '/' + u.audio_file;

        return `<tr class="${rowClass}" data-idx="${i}">
            <td><input type="checkbox" class="row-checkbox" data-idx="${i}" onchange="toggleRowSelect(${i})"></td>
            <td><button class="audio-play-btn" onclick="playAudio('${audioPath}', this)" title="Play">&#9654;</button></td>
            <td><div style="font-size:0.7rem;color:#888;">${dateStr}</div><div>${time}</div></td>
            <td style="max-width:200px;">
                <div style="font-weight:500;">"${escHtml(u.transcript_whisper || '')}"</div>
                <div style="font-size:0.65rem;color:#999;">${u.phase_name || ''} (${u.fsm_state || ''})</div>
            </td>
            <td>${u.matched_option ? u.matched_option.replace(/_/g,' ') : '<span style="color:#c62828;">—</span>'}</td>
            <td>
                <div class="confidence-bar"><div class="fill" style="width:${confWidth}%;background:${confColor};"></div></div>
                <div style="font-size:0.65rem;color:#888;">${u.confidence?.toFixed(0) || 0}%</div>
            </td>
            <td>
                <select class="intent-select ${selectClass}" data-idx="${i}" onchange="setCorrectIntent(${i}, this.value)">
                    <option value="">—</option>
                    ${options.map(o => `<option value="${o}" ${currentCorrect===o?'selected':''}>${o.replace(/_/g,' ')}</option>`).join('')}
                    <option value="GARBAGE" ${u.is_garbage?'selected':''}>GARBAGE</option>
                </select>
            </td>
            <td style="font-size:0.7rem;">${u.fsm_state || ''}</td>
            <td>${statusBadge}</td>
            <td style="font-size:0.65rem;">${u.reviewed_by || ''}</td>
            <td>
                <button onclick="saveAnnotation(${i})" style="font-size:0.7rem;padding:3px 8px;border:1px solid #ddd;border-radius:4px;cursor:pointer;background:#fff;">Save</button>
            </td>
        </tr>`;
    }).join('');
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderPagination(data) {
    const el = document.getElementById('pagination');
    if (data.total_pages <= 1) { el.innerHTML = ''; return; }
    let html = '';
    html += `<button ${data.page<=1?'disabled':''} onclick="goToPage(${data.page-1})">&laquo; Prev</button>`;
    for (let p = 1; p <= data.total_pages; p++) {
        html += `<button class="${p===data.page?'active':''}" onclick="goToPage(${p})">${p}</button>`;
    }
    html += `<button ${data.page>=data.total_pages?'disabled':''} onclick="goToPage(${data.page+1})">Next &raquo;</button>`;
    el.innerHTML = html;
}

function goToPage(p) { currentPage = p; loadUtterances(); }
function clearFilters() {
    document.getElementById('filterDate').value = '';
    document.getElementById('filterStatus').value = '';
    document.getElementById('filterSession').value = '';
    currentPage = 1;
    loadUtterances();
}

// ── Audio Playback ────────────────────────────────
function playAudio(path, btn) {
    if (currentAudio) { currentAudio.pause(); document.querySelectorAll('.audio-play-btn.playing').forEach(b => { b.classList.remove('playing'); b.innerHTML = '&#9654;'; }); }
    const url = API + '/audio/' + path;
    currentAudio = new Audio();
    // Set auth header via fetch + blob
    fetch(url, { headers: authHeaders() })
        .then(r => r.blob())
        .then(blob => {
            currentAudio.src = URL.createObjectURL(blob);
            currentAudio.play();
            btn.classList.add('playing');
            btn.innerHTML = '&#9632;';
            currentAudio.onended = () => { btn.classList.remove('playing'); btn.innerHTML = '&#9654;'; };
        })
        .catch(e => console.error('Audio error:', e));
}

// ── Annotation ────────────────────────────────────
async function setCorrectIntent(idx, value) {
    // Just update the UI, actual save on "Save" button
    currentData[idx]._pendingCorrect = value;
}

async function saveAnnotation(idx) {
    const u = currentData[idx];
    const pending = u._pendingCorrect || '';
    const body = {};

    if (pending === 'GARBAGE') {
        body.is_garbage = true;
    } else if (pending) {
        body.correct_option = pending;
        body.is_garbage = false;
    }

    try {
        const resp = await fetch(API + '/utterances/' + u.session_id + '/' + u.id, {
            method: 'PUT',
            headers: authHeaders(),
            body: JSON.stringify(body),
        });
        if (resp.ok) {
            loadUtterances();
            loadStats();
        }
    } catch (e) { console.error('Save error:', e); }
}

// ── Bulk Operations ───────────────────────────────
function toggleRowSelect(idx) {
    const key = currentData[idx].session_id + '/' + currentData[idx].id;
    const cb = document.querySelector(`input.row-checkbox[data-idx="${idx}"]`);
    if (cb.checked) selectedIds.add(key);
    else selectedIds.delete(key);
    updateBulkBar();
}

function toggleSelectAll() {
    const checked = document.getElementById('headerCheckbox').checked;
    document.querySelectorAll('.row-checkbox').forEach((cb, i) => {
        cb.checked = checked;
        const key = currentData[i].session_id + '/' + currentData[i].id;
        if (checked) selectedIds.add(key);
        else selectedIds.delete(key);
    });
    updateBulkBar();
}

function updateBulkBar() {
    const bar = document.getElementById('bulkBar');
    const count = document.getElementById('bulkCount');
    if (selectedIds.size > 0) {
        bar.classList.add('active');
        count.textContent = selectedIds.size + ' selected';
    } else {
        bar.classList.remove('active');
    }
}

async function bulkApprove() {
    const items = Array.from(selectedIds).map(k => {
        const [session_id, utt_id] = k.split('/');
        return { session_id, utt_id };
    });
    try {
        await fetch(API + '/bulk-approve', {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({ utterance_ids: items }),
        });
        selectedIds.clear();
        loadUtterances();
        loadStats();
    } catch (e) { console.error('Bulk error:', e); }
}

// ── Export ─────────────────────────────────────────
async function exportDataset(format) {
    try {
        const resp = await fetch(API + '/export?format=' + format, { headers: authHeaders() });
        const data = await resp.json();
        alert('Exported ' + data.exported + ' utterances to: ' + data.output);
    } catch (e) { console.error('Export error:', e); }
}

// ── Init ──────────────────────────────────────────
checkAuth();
</script>
</body>
</html>
